<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Room — Telvi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="room-page">
    <header class="room-header">
        <div>
            <h1 id="room-title">Study Room</h1>
            <p id="room-code-display">Room Code: ------</p>
        </div>

        <div class="room-header-actions">
            <button 
                id="theme-toggle"
                class="theme-toggle"
                type="button"
                aria-label="Toggle dark mode">
                ☾
            </button>

            <button id="copy-code" class= "secondary-button">
                Copy Room Code
            </button>

            <button id="leave-room" class="danger-button">
                Leave Room
            </button>
        </div>
    </header>
    <main class="room-container">
        <section class="chat-panel">
            <div class="panel-header">
                <h2>Roomm Chat</h2>
                <span class="online-inndicator">
                    ● Local session
                </span>
            </div>

            <div id="chat-messages" class="chat-messages">
                <p class="empty-chat-message">
                    No messages yet. Start the converstation!
                </p>
            </div>
            <div class="message-input-area">
                <input 
                    type="text"
                    id="message-input"
                    placeholder="Type a message..."
                    maxlength="500">
                <button id="send-message" class="primary-button">
                    Send
                </button>
            </div>
        </section>
        <aside class="side-panel">
            <section class="feature-card">
                <h3>Study Tools</h3>
                <p>More Collaborative tools are comming soon...</p>
            </section>
        </aside>
    </main>

    <script src="room.js"></script>
</body>
</html>
