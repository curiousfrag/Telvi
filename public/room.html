<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Room | Telvi</title>


    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="room-header">
        <div>
            <h1 id="room-title">Study Room</h1>
            <p id="room-code-display">Room Code: ------</p>
        </div>

        <button id="theme-toggle" class="theme-toggle" type="button">
            🌙
        </button>
    </header>

<main class="room-container">

    <section class="room-actions">
        <button id="copy-code">Copy Room Code</button>
        <button id="leave-room" class="secondary-button">
            Leave Room
        </button>
    </section>

    <section class="chat-container">

        <h2>Room Chat</h2>

        <div id="chat-messages" class="chat-messages">
            <p class="empty-chat">
                No messages yet. Start studying together!
            </p>
        </div>
        <div class="chat-input-area">
            <input
                type="text"
                id="message-input"
                placeholder="Type a message...">
                <button id="send-message">Send</button>
        </div>
    </section>
</main>

<script src="room.js"></script>

</body>
</html>
